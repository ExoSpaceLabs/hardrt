name: Linux

on:
  push:
    branches:
      - main
      - develop
    tags: [ '*.*.*' ]
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install base build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make g++ binutils

      - name: Configure & build (null port contract)
        run: |
          cmake -S . -B build-null -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHARDRT_PORT=null \
            -DHARDRT_BUILD_TESTS=ON \
            -DHARDRT_BUILD_EXAMPLES=OFF
          cmake --build build-null --parallel

      - name: Validate timing profile isolation
        run: |
          set -euxo pipefail

          if nm build-null/libhardrt.a | grep -q hrt_timing_fixture_counter; then
            echo "default timing profile unexpectedly references timing fixture"
            exit 1
          fi

          cmake -S . -B build-timing-ipc -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHARDRT_PORT=null \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DHARDRT_TIMING_PROFILE=ipc \
            -DHARDRT_TIMING_HOOK_HEADER="$PWD/tests/timing_profile_consumer/timing_ipc_hooks_compile.h"
          cmake --build build-timing-ipc --parallel

          nm build-timing-ipc/libhardrt.a | grep -q hrt_timing_fixture_counter

          rm -rf install-timing-ipc build-timing-profile-consumer
          cmake --install build-timing-ipc --prefix "$PWD/install-timing-ipc"
          cmake -S tests/timing_profile_consumer -B build-timing-profile-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-timing-ipc"
          cmake --build build-timing-profile-consumer --parallel
          ./build-timing-profile-consumer/timing_profile_smoke

      - name: Configure & build (POSIX)
        run: |
          cmake -S . -B build-posix -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHARDRT_PORT=posix \
            -DHARDRT_BUILD_TESTS=ON \
            -DHARDRT_BUILD_EXAMPLES=OFF
          cmake --build build-posix --parallel

      - name: Run tests (POSIX)
        run: |
          ctest -V --test-dir build-posix --output-on-failure

      - name: Validate single-priority task creation
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build-min-prio -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHARDRT_PORT=posix \
            -DHARDRT_BUILD_TESTS=ON \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DHARDRT_CFG_MAX_PRIO=1
          cmake --build build-min-prio --target hardrt_min_prio_smoke --parallel
          ctest -V --test-dir build-min-prio -R '^hardrt_min_prio_smoke$' --output-on-failure

      - name: Build and self-test POSIX examples
        run: |
          HARDRT_EXAMPLE_TIMEOUT=3s ./scripts/run-all-examples.sh

      - name: Validate installed public API
        run: |
          rm -rf install-posix-ci build-installed-consumer
          cmake --install build-posix --prefix "$PWD/install-posix-ci"

          test ! -e install-posix-ci/include/hardrt_port_int.h
          test ! -e install-posix-ci/include/hardrt_kernel.h
          test ! -e install-posix-ci/include/hardrt_port_contract.h
          test ! -e install-posix-ci/include/hardrt_timing.h
          test ! -e install-posix-ci/include/hardrt_timing_config.h

          cmake -S tests/installed_consumer -B build-installed-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-posix-ci"
          cmake --build build-installed-consumer --parallel

      - name: Install ARM bare-metal toolchain (22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Prepare STM32CubeH7 headers (22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          cube="$RUNNER_TEMP/STM32CubeH7"
          rm -rf "$cube"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/STMicroelectronics/STM32CubeH7.git "$cube"
          git -C "$cube" sparse-checkout set --skip-checks \
            Drivers/CMSIS/Core/Include \
            Drivers/CMSIS/Device/ST/STM32H7xx \
            Drivers/STM32H7xx_HAL_Driver
          git -C "$cube" submodule update --init --depth 1 \
            Drivers/CMSIS/Device/ST/STM32H7xx \
            Drivers/STM32H7xx_HAL_Driver

          test -f "$cube/Drivers/CMSIS/Core/Include/core_cm7.h"
          test -f "$cube/Drivers/CMSIS/Device/ST/STM32H7xx/Include/stm32h755xx.h"
          test -f "$cube/Drivers/STM32H7xx_HAL_Driver/Inc/stm32h7xx_hal.h"
          echo "STM32CUBE_H7_ROOT=$cube" >> "$GITHUB_ENV"

      - name: Configure & build (Cortex-M library, 22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cmake -S . -B build-cortex_m -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHARDRT_PORT=cortex_m \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DHARDRT_ENABLE_CPP=ON \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi.cmake
          cmake --build build-cortex_m --parallel

      - name: Cross-build STM32H755 examples (22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          BUILD_TYPE=${{ matrix.build_type }} ./scripts/build-stm32-examples-ci.sh

      - name: Install (POSIX + Cortex-M) and create tarballs (tag builds, 22.04 only)
        if: matrix.os == 'ubuntu-22.04' && github.ref_type == 'tag'
        run: |
          set -euxo pipefail
          rm -rf packages install-posix install-cortexm bundle
          mkdir -p packages

          cmake --install build-posix --prefix install-posix
          cmake --install build-cortex_m --prefix install-cortexm

          tar -C install-posix -czf packages/hardrt-posix-${{ github.ref_name }}.tar.gz .
          tar -C install-cortexm -czf packages/hardrt-cortexm-${{ github.ref_name }}.tar.gz .

          mkdir -p bundle/posix bundle/cortex_m
          cp -a install-posix/* bundle/posix/
          cp -a install-cortexm/* bundle/cortex_m/
          tar -C bundle -czf packages/hardrt-bundle-${{ github.ref_name }}.tar.gz .

          ls -la packages

      - name: Upload package artifact (tag builds, 22.04 only)
        if: matrix.os == 'ubuntu-22.04' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hardrt-tarballs-${{ github.ref_name }}
          path: packages/*.tar.gz
          if-no-files-found: error

      - name: Upload to GitHub Release (tag builds, 22.04 only)
        if: matrix.os == 'ubuntu-22.04' && success() && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tar.gz

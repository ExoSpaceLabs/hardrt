name: Auto Tag Release

# The VERSION change on develop is inert. Only successful main CI runs can
# authorize a non-v tag, after an approved develop -> main promotion.
on:
  workflow_run:
    workflows: ["Linux", "Signal stress", "Documentation"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: hardrt-auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check current main, complete CI, promotion and source equivalence
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          git fetch origin main --tags
          current_main="$(git rev-parse origin/main)"
          if [[ "$CI_SHA" != "$current_main" ]]; then
            echo "Stale successful main CI: $CI_SHA (main=$current_main); skip"
            exit 0
          fi

          # All three required main push workflows must have succeeded on
          # exactly this commit. The final completion event will do the tagging.
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${CI_SHA}&per_page=100")"
          for workflow in "Linux" "Signal stress" "Documentation"; do
            if ! jq -e --arg name "$workflow" --arg sha "$CI_SHA" '
              [.workflow_runs[] | select(.name == $name and .head_sha == $sha
                and .head_branch == "main" and .event == "push"
                and .status == "completed" and .conclusion == "success")] | length > 0
            ' <<< "$runs" >/dev/null; then
              echo "$workflow is not successful for current main SHA; skip"
              exit 0
            fi
          done

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid VERSION: $version" >&2
            exit 1
          }
          python3 scripts/extract_release_notes.py "$version" RELEASE_NOTES.md >/dev/null
          tag="$version"

          # For a new tag require an ordinary approved develop -> main merge.
          # Its second parent is the qualified develop source, but the commit
          # SHA changes because the merge records promotion history.
          qualified_sha="$(git rev-parse "${CI_SHA}^2")" || {
            echo "Release must be a two-parent develop -> main merge commit" >&2
            exit 1
          }
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CI_SHA}/pulls")"
          count="$(jq --arg sha "$CI_SHA" --arg qualified "$qualified_sha" '
            [.[] | select(.base.ref == "main" and .head.ref == "develop"
              and .merged_at != null and .merge_commit_sha == $sha
              and .head.sha == $qualified)] | length
          ' <<< "$prs")"
          [[ "$count" == "1" ]] || {
            echo "New tag requires exactly one merged develop -> main PR at this commit" >&2
            exit 1
          }
          pr_body="$(jq -r --arg sha "$CI_SHA" '
            .[] | select(.merge_commit_sha == $sha) | .body // ""
          ' <<< "$prs")"
          grep -Fqx "Hardware-qualified SHA: $qualified_sha" <<< "$pr_body" || {
            echo "Release PR must attest the exact qualified SHA" >&2
            exit 1
          }
          grep -Fqx "Hardware qualification: PASS" <<< "$pr_body" || {
            echo "Release PR lacks operator's full H755 qualification approval" >&2
            exit 1
          }
          python3 scripts/check_release_qualification_diff.py "$qualified_sha" "$CI_SHA"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$CI_SHA" ]]; then
              echo "Existing $tag at $tagged_sha; never move release tags" >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released; no new package"
            else
              echo "Existing tag without release; retry packaging"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$CI_SHA" -m "HardRT $tag"
          git push origin "refs/tags/$tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      release_sha: ${{ needs.tag.outputs.release_sha }}
    permissions:
      contents: write

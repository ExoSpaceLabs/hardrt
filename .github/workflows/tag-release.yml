name: Auto Tag Release

# VERSION on main is the only release identifier. CI must be green before
# creating a new immutable tag or publishing/recovering its release.
on:
  workflow_run:
    workflows: ["Linux", "Signal stress", "Documentation"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: hardrt-auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      finalize: ${{ steps.tag.outputs.finalize }}
      tag: ${{ steps.tag.outputs.tag }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check all main CI and reconcile VERSION release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "finalize=false" >> "$GITHUB_OUTPUT"
          git fetch origin main --tags
          if [[ "$CI_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Superseded main CI, no release action"
            exit 0
          fi

          # Never publish on the first completed CI alone; all three
          # push workflows must have succeeded on the *same* current SHA.
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${CI_SHA}&per_page=100")"
          for workflow in "Linux" "Signal stress" "Documentation"; do
            if ! jq -e --arg name "$workflow" --arg sha "$CI_SHA" '
              [.workflow_runs[] | select(.name == $name and .head_sha == $sha
                and .head_branch == "main" and .event == "push"
                and .status == "completed" and .conclusion == "success")]
              | length > 0
            ' <<< "$runs" >/dev/null; then
              echo "$workflow has not passed on $CI_SHA, skip"
              exit 0
            fi
          done

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid VERSION: $version" >&2
            exit 1
          }
          python3 scripts/extract_release_notes.py "$version" RELEASE_NOTES.md >/dev/null
          echo "tag=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            # A tag never moves. Later main commits may keep the same VERSION.
            release_sha="$(git rev-list -n 1 "$version")"
            git merge-base --is-ancestor "$release_sha" "$CI_SHA" || {
              echo "Existing $version tag is not on main ancestry" >&2
              exit 1
            }
            echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            if gh release view "$version" >/dev/null 2>&1; then
              if [[ "$(gh release view "$version" --json isDraft --jq .isDraft)" == true ]]; then
                echo "finalize=true" >> "$GITHUB_OUTPUT"
                echo "Existing $version draft: publish after CI and asset verification"
              else
                echo "Existing $version published: no action"
              fi
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "Existing $version tag without release: recover packaging"
            fi
            exit 0
          fi

          latest="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$latest" ]]; then
            highest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)"
            [[ "$highest" == "$version" && "$latest" != "$version" ]] || {
              echo "VERSION $version must be newer than $latest" >&2
              exit 1
            }
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" "$CI_SHA" -m "HardRT $version"
          git push origin "refs/tags/$version"
          echo "release_sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      release_sha: ${{ needs.tag.outputs.release_sha }}
    permissions:
      contents: write

  publish-existing:
    needs: tag
    if: needs.tag.outputs.finalize == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify staged assets and publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          gh release download "$TAG" --dir staged --pattern 'hardrt-*' --pattern SHA256SUMS
          for name in "hardrt-cortexm-$TAG.tar.gz" \
                      "hardrt-posix-linux-amd64-$TAG.tar.gz" \
                      "hardrt-posix-linux-arm64-$TAG.tar.gz" SHA256SUMS; do
            test -s "staged/$name" || { echo "Missing staged asset: $name" >&2; exit 1; }
          done
          ( cd staged && sha256sum -c SHA256SUMS )
          python3 scripts/extract_release_notes.py "$TAG" RELEASE_NOTES.md > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md --draft=false
          echo "Published verified existing release $TAG"

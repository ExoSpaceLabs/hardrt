name: Documentation

on:
  push:
    branches:
      - main
      - develop
    tags: [ '*.*.*' ]
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ python3 doxygen shellcheck xz-utils

      - name: Configure generated public headers
        run: |
          cmake -S . -B build-docs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=posix \
            -DHARDRT_ENABLE_CPP=ON \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF
          cmake --build build-docs --parallel

      - name: Compile documented C API
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iinc -Ibuild-docs/generated \
            -c tests/docs/api_c_smoke.c -o "$RUNNER_TEMP/api_c_smoke.o"

      - name: Compile documented C++ API
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Iinc -Icpp -Ibuild-docs/generated \
            -c tests/docs/api_cpp_smoke.cpp -o "$RUNNER_TEMP/api_cpp_smoke.o"

      - name: Check links paths and stale references
        run: python3 scripts/check-docs.py

      - name: Smoke-test release helpers
        shell: bash
        run: |
          set -euxo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/extract_release_notes.py "$version" RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          grep -Fqx "# HardRT v$version Release Notes" <(head -n 1 "$RUNNER_TEMP/release-notes.md")
          python3 scripts/check_release_qualification_diff.py HEAD HEAD
          python3 scripts/test_release_contract.py

          bash -n scripts/package_stm32_qualification.sh
          bash -n scripts/finalize_release.sh
          shellcheck scripts/package_stm32_qualification.sh scripts/finalize_release.sh

          run_dir="$RUNNER_TEMP/qualification-run"
          output_dir="$RUNNER_TEMP/qualification-package"
          mkdir -p "$run_dir/raw"
          printf 'synthetic raw evidence\n' > "$run_dir/raw/smoke.log"
          # Synthetic parser fixture only: no physical qualification is implied.
          {
            echo 'core_hz=64000000 samples=8 rows=14 profile=1 error=0'
            for (( i=0; i<14; ++i )); do
              case "$i" in
                0|1|2|3) bytes=0 ;;
                4|5) bytes=4 ;;
                6|7) bytes=16 ;;
                8|9) bytes=64 ;;
                10|11) bytes=256 ;;
                12|13) bytes=1024 ;;
              esac
              printf 'BENCH id=%d bytes=%d count=8 api_min=100 api_avg=120 api_max=140 masked_min=20 masked_avg=30 masked_max=40\n' "$i" "$bytes"
            done
            echo 'RESULT: PASS'
          } > "$run_dir/raw/sync_benchmark_gdb.log"
          awk -v target=8 -v csv="$run_dir/raw/sync_benchmark_metrics.csv" \
            -f scripts/parse_stm32_sync_benchmark.awk \
            "$run_dir/raw/sync_benchmark_gdb.log"
          cat > "$run_dir/qualification.md" <<EOF
          # HardRT STM32H755 Hardware Qualification Report

          - HardRT SHA: \`$GITHUB_SHA\`
          - HardRT tracked source state: **clean**
          - Functional contracts: **16**
          - Hardware benchmarks: **52**
          - Selected mode: **all tests (functional + benchmark)**

          ## Qualification verdict

          - Board probe: **PASS**
          - Functional contracts passed: **16 / 16**
          - Functional contracts failed: **0**
          - Functional contracts not run: **0**
          - Benchmarks passed: **52 / 52**
          - Benchmarks failed: **0**
          - Benchmarks not run: **0**
          - Overall: **PASS**

          ## Completion

          - Runner: \`scripts/stm32_manual_test_full.sh\`
          EOF

          bash scripts/package_stm32_qualification.sh \
            0.0.0 "$run_dir" --output-dir "$output_dir"

          archive="$output_dir/hardrt-stm32-qualification-0.0.0.tar.xz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd "$output_dir" && sha256sum -c "$(basename "$checksum")")
          tar -tJf "$archive" | grep -q 'hardrt-stm32-qualification-0.0.0/qualification.md'
          tar -tJf "$archive" | grep -q 'hardrt-stm32-qualification-0.0.0/PACKAGE_METADATA.txt'

          first_hash="$(sha256sum "$archive" | awk '{print $1}')"
          bash scripts/package_stm32_qualification.sh \
            0.0.0 "$run_dir" --output-dir "$output_dir" --force
          second_hash="$(sha256sum "$archive" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"

          bad_run="$RUNNER_TEMP/qualification-run-partial"
          cp -a "$run_dir" "$bad_run"
          sed -i 's/all tests (functional + benchmark)/functional/' "$bad_run/qualification.md"
          if bash scripts/package_stm32_qualification.sh \
            0.0.0 "$bad_run" --output-dir "$RUNNER_TEMP/bad-package"; then
            echo "Partial qualification unexpectedly packaged successfully"
            exit 1
          fi


          missing_run="$RUNNER_TEMP/qualification-run-missing-sync"
          cp -a "$run_dir" "$missing_run"
          rm "$missing_run/raw/sync_benchmark_metrics.csv"
          if bash scripts/package_stm32_qualification.sh \
            0.0.0 "$missing_run" --output-dir "$RUNNER_TEMP/missing-package"; then
            echo "Missing synchronization metrics unexpectedly packaged successfully"
            exit 1
          fi

          legacy_run="$RUNNER_TEMP/qualification-run-old-matrix"
          cp -a "$run_dir" "$legacy_run"
          sed -i 's/Hardware benchmarks: \*\*52\*\*/Hardware benchmarks: **38**/' "$legacy_run/qualification.md"
          sed -i 's/Benchmarks passed: \*\*52 \/ 52\*\*/Benchmarks passed: **38 \/ 38**/' "$legacy_run/qualification.md"
          if bash scripts/package_stm32_qualification.sh \
            0.0.0 "$legacy_run" --output-dir "$RUNNER_TEMP/legacy-package"; then
            echo "Obsolete 38-metric release evidence unexpectedly packaged successfully"
            exit 1
          fi

          historical_log="$RUNNER_TEMP/historical-finalizer.log"
          bash scripts/finalize_release.sh \
            0.5.1 \
            "$RUNNER_TEMP/definitely-missing-0.5.1-run" \
            > "$historical_log"
          grep -q '^Historical 0.5.1 qualification record verification PASS$' "$historical_log"
          grep -q '^  full raw archive retained: no$' "$historical_log"
          grep -q '^Release finalization PASS: 0.5.1$' "$historical_log"

      - name: Generate Doxygen without documentation errors
        run: |
          cat > "$RUNNER_TEMP/Doxyfile" <<EOF
          PROJECT_NAME = HardRT
          INPUT = $GITHUB_WORKSPACE/inc $GITHUB_WORKSPACE/cpp
          RECURSIVE = YES
          EXTRACT_ALL = NO
          GENERATE_HTML = YES
          GENERATE_LATEX = NO
          HAVE_DOT = NO
          OUTPUT_DIRECTORY = $RUNNER_TEMP/doxygen
          WARN_AS_ERROR = YES
          WARN_IF_UNDOCUMENTED = NO
          QUIET = YES
          EOF
          doxygen "$RUNNER_TEMP/Doxyfile"

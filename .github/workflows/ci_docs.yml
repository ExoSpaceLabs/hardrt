name: Documentation

on:
  push:
    branches:
      - main
      - develop
    tags: [ '*.*.*' ]
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ python3 doxygen shellcheck xz-utils

      - name: Configure generated public headers
        run: |
          cmake -S . -B build-docs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=posix \
            -DHARDRT_ENABLE_CPP=ON \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF
          cmake --build build-docs --parallel

      - name: Compile documented C API
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iinc -Ibuild-docs/generated \
            -c tests/docs/api_c_smoke.c -o "$RUNNER_TEMP/api_c_smoke.o"

      - name: Compile documented C++ API
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Iinc -Icpp -Ibuild-docs/generated \
            -c tests/docs/api_cpp_smoke.cpp -o "$RUNNER_TEMP/api_cpp_smoke.o"

      - name: Check links paths and stale references
        run: python3 scripts/check-docs.py

      - name: Smoke-test release helpers
        shell: bash
        run: |
          set -euxo pipefail

          python3 scripts/extract_release_notes.py 0.5.1 RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '^# HardRT v0.5.1 Release Notes$' "$RUNNER_TEMP/release-notes.md"
          python3 scripts/check_release_qualification_diff.py HEAD HEAD

          bash -n scripts/package_stm32_qualification.sh
          bash -n scripts/finalize_release.sh
          shellcheck scripts/package_stm32_qualification.sh scripts/finalize_release.sh

          run_dir="$RUNNER_TEMP/qualification-run"
          output_dir="$RUNNER_TEMP/qualification-package"
          mkdir -p "$run_dir/raw"
          printf 'synthetic raw evidence\n' > "$run_dir/raw/smoke.log"
          cat > "$run_dir/qualification.md" <<EOF
          # HardRT STM32H755 Hardware Qualification Report

          - HardRT SHA: \`$GITHUB_SHA\`
          - HardRT tracked source state: **clean**
          - Functional contracts: **13**
          - Hardware benchmarks: **38**
          - Selected mode: **all tests (functional + benchmark)**

          ## Qualification verdict

          - Board probe: **PASS**
          - Functional contracts passed: **13 / 13**
          - Functional contracts failed: **0**
          - Functional contracts not run: **0**
          - Benchmarks passed: **38 / 38**
          - Benchmarks failed: **0**
          - Benchmarks not run: **0**
          - Overall: **PASS**

          ## Completion

          - Runner: \`scripts/stm32_manual_test_full.sh\`
          EOF

          bash scripts/package_stm32_qualification.sh \
            0.0.0 "$run_dir" --output-dir "$output_dir"

          archive="$output_dir/hardrt-stm32-qualification-0.0.0.tar.xz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd "$output_dir" && sha256sum -c "$(basename "$checksum")")
          tar -tJf "$archive" | grep -q 'hardrt-stm32-qualification-0.0.0/qualification.md'
          tar -tJf "$archive" | grep -q 'hardrt-stm32-qualification-0.0.0/PACKAGE_METADATA.txt'

          first_hash="$(sha256sum "$archive" | awk '{print $1}')"
          bash scripts/package_stm32_qualification.sh \
            0.0.0 "$run_dir" --output-dir "$output_dir" --force
          second_hash="$(sha256sum "$archive" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"

          bad_run="$RUNNER_TEMP/qualification-run-partial"
          cp -a "$run_dir" "$bad_run"
          sed -i 's/all tests (functional + benchmark)/functional/' "$bad_run/qualification.md"
          if bash scripts/package_stm32_qualification.sh \
            0.0.0 "$bad_run" --output-dir "$RUNNER_TEMP/bad-package"; then
            echo "Partial qualification unexpectedly packaged successfully"
            exit 1
          fi

      - name: Generate Doxygen without documentation errors
        run: |
          cat > "$RUNNER_TEMP/Doxyfile" <<EOF
          PROJECT_NAME = HardRT
          INPUT = $GITHUB_WORKSPACE/inc $GITHUB_WORKSPACE/cpp
          RECURSIVE = YES
          EXTRACT_ALL = NO
          GENERATE_HTML = YES
          GENERATE_LATEX = NO
          HAVE_DOT = NO
          OUTPUT_DIRECTORY = $RUNNER_TEMP/doxygen
          WARN_AS_ERROR = YES
          WARN_IF_UNDOCUMENTED = NO
          QUIET = YES
          EOF
          doxygen "$RUNNER_TEMP/Doxyfile"

name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and branch alignment
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use X.Y.Z without a v prefix: $version"
            exit 1
          fi

          project_version="$({ sed -nE 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt || true; } | head -n1)"
          if [[ -z "$project_version" || "$project_version" != "$version" ]]; then
            echo "Tag version $version does not match CMake project version $project_version"
            exit 1
          fi

          git fetch origin main develop --force
          main_sha="$(git rev-parse origin/main)"
          develop_sha="$(git rev-parse origin/develop)"

          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tag must point at the current main commit"
            echo "tag=$GITHUB_SHA main=$main_sha"
            exit 1
          fi

          if [[ "$main_sha" != "$develop_sha" ]]; then
            echo "main and develop must be aligned before release publication"
            echo "main=$main_sha develop=$develop_sha"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gcc-arm-none-eabi binutils

      - name: Build POSIX package
        run: |
          set -euxo pipefail
          cmake -S . -B build-posix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=posix \
            -DHARDRT_ENABLE_CPP=ON \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF
          cmake --build build-posix --parallel

      - name: Build Cortex-M package
        run: |
          set -euxo pipefail
          cmake -S . -B build-cortexm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=cortex_m \
            -DHARDRT_ENABLE_CPP=ON \
            -DHARDRT_BUILD_TESTS=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi.cmake
          cmake --build build-cortexm --parallel

      - name: Install packages and validate POSIX consumer
        run: |
          set -euxo pipefail
          rm -rf install-posix install-cortexm build-installed-consumer
          cmake --install build-posix --prefix "$PWD/install-posix"
          cmake --install build-cortexm --prefix "$PWD/install-cortexm"

          cmake -S tests/installed_consumer -B build-installed-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-posix"
          cmake --build build-installed-consumer --parallel

      - name: Create reproducible release archives
        shell: bash
        run: |
          set -euxo pipefail

          version="${GITHUB_REF_NAME}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          rm -rf packages bundle
          mkdir -p packages bundle/posix bundle/cortex_m

          cp -a install-posix/. bundle/posix/
          cp -a install-cortexm/. bundle/cortex_m/

          pack() {
            local source_dir="$1"
            local output="$2"
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$source_dir" \
              -cf - . | gzip -n > "$output"
          }

          pack install-posix "packages/hardrt-posix-${version}.tar.gz"
          pack install-cortexm "packages/hardrt-cortexm-${version}.tar.gz"
          pack bundle "packages/hardrt-bundle-${version}.tar.gz"

          (
            cd packages
            sha256sum hardrt-*.tar.gz > SHA256SUMS
          )

          python3 scripts/extract_release_notes.py "$version" RELEASE_NOTES.md > release-notes.md
          ls -la packages
          cat packages/SHA256SUMS

      - name: Retain generated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hardrt-release-${{ github.ref_name }}
          path: |
            packages/hardrt-*.tar.gz
            packages/SHA256SUMS
            release-notes.md
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            packages/hardrt-posix-${{ github.ref_name }}.tar.gz
            packages/hardrt-cortexm-${{ github.ref_name }}.tar.gz
            packages/hardrt-bundle-${{ github.ref_name }}.tar.gz
            packages/SHA256SUMS
          fail_on_unmatched_files: true

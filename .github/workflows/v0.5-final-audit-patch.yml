name: Apply v0.5 final audit patch

on:
  push:
    branches:
      - fix/v0.5-final-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: fix/v0.5-final-audit
          fetch-depth: 0

      - name: Align audit input with current documentation wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/API_C.md')
          text = p.read_text()
          current = '`hrt_task_delete()` moves the current non-idle task to EXITED and yields. Task trampolines perform the same transition automatically when task entry returns.'
          expected = '`hrt_task_delete()` moves the current task to EXITED and schedules another task. The exited slot remains owned until later reclamation. A naturally returning task follows the same path through the port trampoline.'
          if current not in text:
              raise SystemExit('unexpected docs/API_C.md task-delete wording')
          p.write_text(text.replace(current, expected, 1))

          p = Path('docs/SEMAPHORES.md')
          text = p.read_text()
          current = '`hrt_sem_take()` is a task-context operation. It first tries the fast path. When no token is available, it:'
          expected = '`hrt_sem_take()` is a blocking task-context operation. If no token is available, the calling task joins the semaphore FIFO and becomes blocked.'
          if current not in text:
              raise SystemExit('unexpected docs/SEMAPHORES.md blocking-take wording')
          p.write_text(text.replace(current, expected, 1))
          PY

      - name: Apply audited corrections
        run: python3 scripts/apply_v0_5_final_audit.py

      - name: Verify patch produced changes
        run: git diff --check && test -n "$(git status --porcelain)"

      - name: Commit audited source and documentation corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake src inc tests docs
          git commit -m "fix(hardrt): harden v0.5 release contracts"
          git push origin HEAD:fix/v0.5-final-audit

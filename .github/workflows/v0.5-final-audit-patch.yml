name: Apply v0.5 final audit patch

on:
  push:
    branches:
      - fix/v0.5-final-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.5-final-audit
          fetch-depth: 0

      - name: Apply audited corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Public facade: make task-only calls validate release-build context.
          replace('CMakeLists.txt',
              '"HARDRT_CORE_IMPL;hrt_init=hrt__init_impl;hrt_create_task=hrt__create_task_impl;hrt_start=hrt__start_impl"',
              '"HARDRT_CORE_IMPL;hrt_init=hrt__init_impl;hrt_create_task=hrt__create_task_impl;hrt_start=hrt__start_impl;hrt_sleep=hrt__sleep_impl;hrt_yield=hrt__yield_impl;hrt_task_delete=hrt__task_delete_impl"')

          replace('src/internal/hardrt_kernel.h',
              'int hrt__get_current(void);\nvoid hrt__set_current(int id);',
              'int hrt__get_current(void);\nint hrt__current_running_app_task(void);\nvoid hrt__set_current(int id);')

          replace('src/core/hardrt_lifecycle.c',
              'void hrt__start_impl(void);\n',
              'void hrt__start_impl(void);\nvoid hrt__sleep_impl(uint32_t ms);\nvoid hrt__yield_impl(void);\nvoid hrt__task_delete_impl(void);\n')

          replace('src/core/hardrt_lifecycle.c',
              'static int valid_tick_hz(const uint32_t tick_hz) {\n    return tick_hz >= HRT_TICK_HZ_MIN && tick_hz <= HRT_TICK_HZ_MAX;\n}\n',
              '''static int valid_tick_hz(const uint32_t tick_hz) {\n    return tick_hz >= HRT_TICK_HZ_MIN && tick_hz <= HRT_TICK_HZ_MAX;\n}\n\nint hrt__current_running_app_task(void) {\n    const int id = hrt__get_current();\n    if (id < 0 || id >= HARDRT_APP_MAX_TASKS) {\n        hrt_error(ERR_INVALID_TASK);\n        return -1;\n    }\n\n    const _hrt_tcb_t *task = hrt__tcb(id);\n    if (task == NULL || task->slot_state != HRT_SLOT_USED ||\n        task->state != HRT_RUNNING) {\n        hrt_error(ERR_INVALID_TASK);\n        return -1;\n    }\n    return id;\n}\n''')

          replace('src/core/hardrt_lifecycle.c',
              'hrt_status_t hrt_start(void) {\n',
              '''void hrt_sleep(const uint32_t ms) {\n    if (hrt__current_running_app_task() < 0) return;\n    hrt__sleep_impl(ms);\n}\n\nvoid hrt_yield(void) {\n    if (hrt__current_running_app_task() < 0) return;\n    hrt__yield_impl();\n}\n\nvoid hrt_task_delete(void) {\n    if (hrt__current_running_app_task() < 0) return;\n    hrt__task_delete_impl();\n}\n\nhrt_status_t hrt_start(void) {\n''')

          replace('src/core/hardrt_sem.c',
              'int hrt_sem_take(hrt_sem_t *s) {\n    if (hrt_sem_try_take(s) == 0) return 0;\n\n    const int me = hrt__get_current();',
              'int hrt_sem_take(hrt_sem_t *s) {\n    const int me = hrt__current_running_app_task();\n    if (me < 0) return -1;\n    if (hrt_sem_try_take(s) == 0) return 0;\n\n')
          replace('src/core/hardrt_sem.c',
              '#if HARDRT_DEBUG == 1\n    if (me < 0 || me >= HARDRT_APP_MAX_TASKS) {\n        hrt_error(ERR_INVALID_ID);\n        return -1;\n    }\n#endif\n\n    hrt_port_crit_enter();',
              '    hrt_port_crit_enter();')

          replace('src/core/hardrt_queue.c',
              'int hrt_queue_send(hrt_queue_t *q, const void *item) {\n    HRT_ASSERT(q);\n    HRT_ASSERT(item);\n    for (;;) {',
              'int hrt_queue_send(hrt_queue_t *q, const void *item) {\n    HRT_ASSERT(q);\n    HRT_ASSERT(item);\n    const int me = hrt__current_running_app_task();\n    if (me < 0) return -1;\n    for (;;) {')
          replace('src/core/hardrt_queue.c',
              '        if (hrt_queue_try_send(q, item) == 0) return 0;\n        const int me = hrt__get_current();\n\n        hrt_port_crit_enter();',
              '        if (hrt_queue_try_send(q, item) == 0) return 0;\n\n        hrt_port_crit_enter();')
          replace('src/core/hardrt_queue.c',
              'int hrt_queue_recv(hrt_queue_t *q, void *out) {\n    HRT_ASSERT(q);\n    HRT_ASSERT(out);\n    for (;;) {',
              'int hrt_queue_recv(hrt_queue_t *q, void *out) {\n    HRT_ASSERT(q);\n    HRT_ASSERT(out);\n    const int me = hrt__current_running_app_task();\n    if (me < 0) return -1;\n    for (;;) {')
          replace('src/core/hardrt_queue.c',
              '        if (hrt_queue_try_recv(q, out) == 0) return 0;\n        const int me = hrt__get_current();\n\n        hrt_port_crit_enter();',
              '        if (hrt_queue_try_recv(q, out) == 0) return 0;\n\n        hrt_port_crit_enter();')

          # Restore the lifecycle suite and make HARDRT_STRICT mean warning-free.
          replace('cmake/hardrt_tester.cmake',
              '  add_executable(hardrt_tests\n          ${CMAKE_CURRENT_LIST_DIR}/../tests/test_main.c\n          )',
              '  add_executable(hardrt_tests)')
          replace('cmake/hardrt_tester.cmake',
              '          ${CMAKE_SOURCE_DIR}/tests/test_identity.c\n          ${CMAKE_SOURCE_DIR}/tests/test_sleep_stop.c',
              '          ${CMAKE_SOURCE_DIR}/tests/test_identity.c\n          ${CMAKE_SOURCE_DIR}/tests/test_lifecycle.c\n          ${CMAKE_SOURCE_DIR}/tests/test_sleep_stop.c')
          replace('tests/test_main.c',
              '    APPEND_GROUP(get_tests_identity);\n    APPEND_GROUP(get_tests_sleep_stop);',
              '    APPEND_GROUP(get_tests_identity);\n    APPEND_GROUP(get_tests_lifecycle);\n    APPEND_GROUP(get_tests_sleep_stop);')
          replace('CMakeLists.txt',
              '    -Wall -Wextra -Wpedantic -Wconversion -Wcast-qual -Wshadow\n',
              '    -Wall -Wextra -Wpedantic -Wconversion -Wcast-qual -Wshadow -Werror\n')
          replace('CMakeLists.txt',
              '  message(STATUS "HARDRT_STRICT enabled (POSIX warnings on)")',
              '  message(STATUS "HARDRT_STRICT enabled (POSIX warnings are errors)")')

          # Lifecycle regression for release-build task-context misuse.
          replace('tests/test_lifecycle.c',
              '#include "test_common.h"\n',
              '#include "test_common.h"\n#include "hardrt_sem.h"\n#include "hardrt_queue.h"\n')
          marker = 'static void test_running_state_allows_creation_but_rejects_restart(void) {'
          insert = r'''static void test_task_only_calls_reject_non_task_context(void) {
    hrt__test_reset_scheduler_state();
    hrt_config_t cfg = external_cfg();
    T_ASSERT_EQ_INT(HRT_OK, hrt_init(&cfg),
                    "init task-context rejection fixture");

    hrt_sem_t sem;
    hrt_sem_init(&sem, 1u);
    g_error = NONE;
    T_ASSERT_EQ_INT(-1, hrt_sem_take(&sem),
                    "blocking semaphore take rejects non-task context");
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "semaphore context rejection records task diagnostic");
    T_ASSERT_EQ_INT(0, hrt_sem_try_take(&sem),
                    "rejected blocking take does not consume available token");

    hrt_queue_t queue;
    uint32_t storage[1] = {0u};
    uint32_t value = 42u;
    uint32_t out = 0u;
    hrt_queue_init(&queue, storage, 1u, sizeof(value));

    g_error = NONE;
    T_ASSERT_EQ_INT(-1, hrt_queue_send(&queue, &value),
                    "blocking queue send rejects non-task context");
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "queue-send context rejection records task diagnostic");
    T_ASSERT_EQ_INT(0, hrt_queue_count(&queue),
                    "rejected blocking send leaves queue unchanged");
    T_ASSERT_EQ_INT(0, hrt_queue_try_send(&queue, &value),
                    "non-blocking queue send remains usable outside task context");

    g_error = NONE;
    T_ASSERT_EQ_INT(-1, hrt_queue_recv(&queue, &out),
                    "blocking queue receive rejects non-task context");
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "queue-receive context rejection records task diagnostic");
    T_ASSERT_EQ_INT(1, hrt_queue_count(&queue),
                    "rejected blocking receive leaves queued item intact");
    T_ASSERT_EQ_INT(0, hrt_queue_try_recv(&queue, &out),
                    "non-blocking queue receive remains usable outside task context");
    T_ASSERT_EQ_UINT(value, out,
                     "non-blocking receive returns the preserved item");

    g_error = NONE;
    hrt_sleep(1u);
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "positive sleep rejects non-task context safely");
    g_error = NONE;
    hrt_sleep(0u);
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "zero sleep rejects non-task context safely");
    g_error = NONE;
    hrt_yield();
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "yield rejects non-task context safely");
    g_error = NONE;
    hrt_task_delete();
    T_ASSERT_EQ_INT(ERR_INVALID_TASK, g_error,
                    "task delete rejects non-task context safely");

    hrt__test_reset_scheduler_state();
}

'''
          replace('tests/test_lifecycle.c', marker, insert + marker)
          replace('tests/test_lifecycle.c',
              '    {"Lifecycle: create/start before init fail", test_create_and_start_before_init_fail},\n    {"Lifecycle: RUNNING allows creation but rejects restart", test_running_state_allows_creation_but_rejects_restart},',
              '    {"Lifecycle: create/start before init fail", test_create_and_start_before_init_fail},\n    {"Lifecycle: task-only calls reject non-task context", test_task_only_calls_reject_non_task_context},\n    {"Lifecycle: RUNNING allows creation but rejects restart", test_running_state_allows_creation_but_rejects_restart},')

          # Remove all known strict-build warnings, including the executable-stack trampoline.
          replace('tests/test_rr_yield.c',
              '    memset((void *)g_global_seq, 0, sizeof(g_global_seq));',
              '    for (int i = 0; i < GLOBAL_SEQ_TARGET; ++i) g_global_seq[i] = 0;')
          replace('tests/test_sleep_queue.c',
              '    memset((void *)g_delays, 0, sizeof(g_delays));\n    memset((void *)g_wake_order, -1, sizeof(g_wake_order));',
              '    for (int i = 0; i < WORKERS; ++i) g_delays[i] = 0u;\n    for (int i = 0; i < 64; ++i) g_wake_order[i] = -1;')
          replace('tests/test_semaphore.c',
              '    memset((void*)g_multi_order, 0, sizeof(g_multi_order));',
              '    for (int i = 0; i < 3; ++i) g_multi_order[i] = 0;')
          replace('tests/test_event.c',
              '    memset((void *)g_event_multi_match, 0, sizeof(g_event_multi_match));\n    memset((void *)g_event_multi_order, 0, sizeof(g_event_multi_order));',
              '    for (int i = 0; i < 2; ++i) {\n        g_event_multi_match[i] = 0u;\n        g_event_multi_order[i] = 0;\n    }')

          giver = r'''static void t_fifo_giver(void *arg) {
    (void)arg;
    hrt_sleep(10);
    int v = 100;
    hrt_queue_send(&g_q_block, &v);
    hrt_sleep(10);
    hrt_queue_send(&g_q_block, &v);
    hrt_sleep(10);
    hrt_queue_send(&g_q_block, &v);
    for (;;) { hrt_yield(); hrt_sleep(1000); }
}

'''
          replace('tests/test_queue.c',
              'static void test_queue_fifo_waiters(void) {',
              giver + 'static void test_queue_fifo_waiters(void) {')
          nested = r'''    /* Giver task */
    auto void giver(void* arg) {
        (void)arg;
        hrt_sleep(10);
        int v = 100;
        hrt_queue_send(&g_q_block, &v);
        hrt_sleep(10);
        hrt_queue_send(&g_q_block, &v);
        hrt_sleep(10);
        hrt_queue_send(&g_q_block, &v);
        for(;;) { hrt_yield(); hrt_sleep(1000); }
    }
    hrt_create_task(giver, NULL, s4, 1024, &a);'''
          replace('tests/test_queue.c', nested,
              '    /* Giver task */\n    hrt_create_task(t_fifo_giver, NULL, s4, 1024, &a);')

          # Public documentation for the hardened context contract.
          replace('inc/hardrt.h',
              ' * shorter than one tick round up to one tick.\n */\nvoid hrt_sleep(uint32_t ms);\n\n/** Voluntarily yield the processor. */\nvoid hrt_yield(void);',
              ' * shorter than one tick round up to one tick. Calls outside the current\n * RUNNING application task are rejected as safe no-ops with ERR_INVALID_TASK.\n */\nvoid hrt_sleep(uint32_t ms);\n\n/** Voluntarily yield the processor. Non-task context is rejected safely. */\nvoid hrt_yield(void);')
          replace('inc/hardrt.h',
              ' * The task enters the internal EXITED state. Its TCB slot remains occupied\n * until reclaimed by a later task creation.\n */',
              ' * The task enters the internal EXITED state. Its TCB slot remains occupied\n * until reclaimed by a later task creation. Calls outside the current RUNNING\n * application task are rejected as safe no-ops with ERR_INVALID_TASK.\n */')
          replace('inc/hardrt_sem.h',
              ' * @return 0 on success, -1 if waiter publication cannot be completed.\n * @note This is a task-context operation.',
              ' * @return 0 on success; -1 for invalid task context or if waiter publication\n * cannot be completed. A rejected call does not consume an available token.\n * @note This is a RUNNING-application-task operation.')
          replace('inc/hardrt_queue.h',
              ' * @return 0 on success, -1 if waiter publication cannot be completed.\n */\nint hrt_queue_send',
              ' * @return 0 on success, -1 for invalid task context or if waiter publication\n * cannot be completed. A rejected context does not modify the queue.\n */\nint hrt_queue_send')
          replace('inc/hardrt_queue.h',
              ' * @return 0 on success, -1 if waiter publication cannot be completed.\n */\nint hrt_queue_recv',
              ' * @return 0 on success, -1 for invalid task context or if waiter publication\n * cannot be completed. A rejected context does not modify the queue.\n */\nint hrt_queue_recv')

          replace('docs/API_C.md',
              '`hrt_task_delete()` moves the current task to EXITED and schedules another task. The exited slot remains owned until later reclamation. A naturally returning task follows the same path through the port trampoline.',
              '`hrt_task_delete()` moves the current task to EXITED and schedules another task. The exited slot remains owned until later reclamation. A naturally returning task follows the same path through the port trampoline. `hrt_sleep()`, `hrt_yield()`, and `hrt_task_delete()` require the current RUNNING application-task context; calls outside that context are safe no-ops that record `ERR_INVALID_TASK`.')
          replace('docs/SEMAPHORES.md',
              '`hrt_sem_take()` is a blocking task-context operation. If no token is available, the calling task joins the semaphore FIFO and becomes blocked.',
              '`hrt_sem_take()` is a blocking RUNNING-application-task operation. Calls outside that context return `-1`, record `ERR_INVALID_TASK`, and do not consume an available token. If no token is available, the calling task joins the semaphore FIFO and becomes blocked.')
          replace('docs/QUEUES.md',
              'Blocking send/receive are task-context operations. There are currently no timeout variants.',
              'Blocking send/receive require the current RUNNING application task. An invalid caller returns `-1`, records `ERR_INVALID_TASK`, and leaves queue contents unchanged. There are currently no timeout variants.')

          # Current GitHub runner warns that checkout v4 targets deprecated Node 20.
          for workflow in ('.github/workflows/ci_posix.yml', '.github/workflows/ci_signal_stress.yml', '.github/workflows/ci_docs.yml'):
              p = Path(workflow)
              text = p.read_text()
              if 'actions/checkout@v4' not in text:
                  raise SystemExit(f'missing checkout v4 in {workflow}')
              p.write_text(text.replace('actions/checkout@v4', 'actions/checkout@v5'))
          PY

          git rm .github/workflows/v0.5-final-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardrt): harden v0.5 release contracts"
          git push origin HEAD:fix/v0.5-final-audit

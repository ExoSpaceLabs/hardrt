name: Apply v0.5 final audit patch

on:
  push:
    branches:
      - fix/v0.5-final-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: fix/v0.5-final-audit
          fetch-depth: 0

      - name: Apply audited corrections
        run: python3 scripts/apply_v0_5_final_audit.py

      - name: Verify patch produced changes
        run: git diff --check && test -n "$(git status --porcelain)"

      - name: Commit audited corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake src inc tests docs .github/workflows
          git commit -m "fix(hardrt): harden v0.5 release contracts"
          git push origin HEAD:fix/v0.5-final-audit
